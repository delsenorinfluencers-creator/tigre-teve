<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar | Tigre Teve</title><link rel="stylesheet" href="/styles.css"></head><body><div class="topbar"><div class="wrap">PANEL ADMINISTRATIVO · TIGRE TEVE</div></div><main class="wrap"><section class="admin"><a href="/">← Volver al sitio</a><h1>Administrar noticias</h1><div id="setup" class="notice">Conexión configurada para Supabase. Si hay errores de permisos, revisa las políticas RLS.</div><div id="login"><h2>Iniciar sesión</h2><div class="field"><label>Correo administrador</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn">Iniciar sesión</button><p id="loginMsg"></p></div><form id="editor" hidden><h2 id="formTitle">Crear noticia</h2><input id="id" type="hidden"><div class="admin-grid"><div class="field"><label>Título *</label><input id="title" required></div><div class="field"><label>Sección</label><select id="category"><option>Regionales</option><option>Nacionales</option><option>Comunidad</option><option>Deportes</option><option>Últimas noticias</option></select></div><div class="field full"><label>Resumen</label><textarea id="excerpt"></textarea></div><div class="field full"><label>Contenido *</label><textarea id="body" required></textarea></div><div class="field full"><label>Foto de portada *</label><input id="cover" type="file" accept="image/*"><small>Máximo 12 MB por imagen.</small></div><div class="field full"><label>Fotos adicionales (puedes seleccionar varias)</label><input id="gallery" type="file" accept="image/*" multiple></div><div class="field full"><label>Slug del enlace (opcional)</label><input id="slug" placeholder="se-genera-desde-el-titulo"></div><div class="field"><label><input id="published" type="checkbox" checked> Publicar noticia</label></div></div><button type="submit">Guardar noticia</button> <button type="button" id="clearBtn">Nueva noticia</button> <button type="button" id="logoutBtn">Cerrar sesión</button><p id="msg"></p><h2>Noticias guardadas</h2><div id="newsList"></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><script src="/admin.js"></script></body></html>
